<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BLVD bake</title>
<!--
  bake.html: renders the WebGL scene at fixed T steps and exposes the frames
  as WebP data URLs. Used offline (headless Chrome) to produce the phone
  image sequence in img/seq/. Not linked from the site.
  Query: ?w=600&h=1300&n=72&c=0&T=1.2 (T renders one preview frame)
-->
<style>html,body{margin:0;background:#070506}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./assets/three.module.min.js"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import { createHero } from './assets/js/gl-hero.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 600, H = +q.get('h') || 1300, N = +q.get('n') || 72, C = +q.get('c') || 0;
const c = document.getElementById('c');
c.style.width = W + 'px'; c.style.height = H + 'px';
const hero = createHero(c, { width: W, height: H, dpr: +(q.get('ss') || 2), bake: true, mobile: false, saltCount: 2600, colour: C, spoonDist: +(q.get('d') || 1.35) });
window.info = hero.renderer.getContext().getParameter(hero.renderer.getContext().VERSION);
if (q.has('T')) { hero.draw(+q.get('T'), 0, 0, 0); window.done = true; }
else {
  // Frame i covers T = 2 * i / (N - 1). Salt shimmer time is fixed.
  // Supersample: render at 2x, then downscale with high quality filtering.
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const ox = out.getContext('2d'); ox.imageSmoothingEnabled = true; ox.imageSmoothingQuality = 'high';
  window.frame = (i) => {
    hero.draw((2 * i) / (N - 1), 0, 0, 3);
    ox.clearRect(0, 0, W, H); ox.drawImage(c, 0, 0, W, H);
    return out.toDataURL('image/webp', +q.get('qual') || 0.72);
  };
  window.done = true;
}
</script></body></html>
