<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"../studio/tesla/js/three.module.min.js"}}</script>
<script type="module">
import * as THREE from 'three';
const {GLTFLoader} = await import('../studio/tesla/js/GLTFLoader.js');
import {RoomEnvironment} from '../studio/tesla/js/RoomEnvironment.js';
const q = new URLSearchParams(location.search); const g = (k, d) => q.has(k) ? +q.get(k) : d;
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true}); r.setPixelRatio(1); r.setSize(W, H);
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = g('expo', 1); r.shadowMap.enabled = true; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(q.get('bg') || '#f2f2f2');
const pm = new THREE.PMREMGenerator(r); sc.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
const glassMat = new THREE.MeshPhysicalMaterial({name: 'Glass', color: 0x16181d, metalness: 0, roughness: .04, transparent: true, opacity: .62, side: THREE.DoubleSide, envMapIntensity: 1.6, clearcoat: 1, depthWrite: false});
let car; if (q.has('old')) { const {buildRoadster} = await import('../studio/tesla/js/roadster.js?v=' + Date.now()); car = buildRoadster(glassMat); } else { const gl = await new GLTFLoader().loadAsync((q.get('glb') || '../studio/tesla/models/roadster.glb') + '?v=' + Date.now()); car = gl.scene; } sc.add(car);
car.traverse(o => { if (o.isMesh) { const m = o.material; if (m.name === 'Glass') o.material = glassMat; else if (/Paint 1|GlossBlack|RimFace|Rim1/.test(m.name)) { const p = new THREE.MeshPhysicalMaterial({name: m.name, color: m.color, metalness: m.metalness, roughness: m.roughness, clearcoat: 1, clearcoatRoughness: .05}); o.material = p; } } });
if (q.has('paint')) car.traverse(o => { if (o.isMesh && /^Paint 1/.test(o.material.name)) o.material.color.set('#' + q.get('paint')); });
const ortho = q.has('ortho');
const az = g('az', 30) * Math.PI / 180, el = g('el', 8) * Math.PI / 180, dist = g('dist', 9);
const T = new THREE.Vector3(g('tx', 0), g('ty', .55), g('tz', 0));
let cam;
if (ortho) { const s = g('os', 2.6); cam = new THREE.OrthographicCamera(-s * W / H, s * W / H, s, -s, .1, 100); }
else cam = new THREE.PerspectiveCamera(g('fov', 30), W / H, .05, 200);
cam.position.set(T.x + dist * Math.cos(el) * Math.sin(az), T.y + dist * Math.sin(el), T.z + dist * Math.cos(el) * Math.cos(az)); cam.lookAt(T);
const dl = new THREE.DirectionalLight(0xffffff, g('sun', 1.6)); dl.position.set(3, 8, 4); dl.castShadow = true; dl.shadow.mapSize.set(2048, 2048); Object.assign(dl.shadow.camera, {left: -4, right: 4, top: 4, bottom: -4}); sc.add(dl);
car.traverse(o => { if (o.isMesh) { o.castShadow = true; } });
const fl = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({opacity: .25})); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; if (!q.has('nofloor')) sc.add(fl);
if (q.has('hide')) { const re = new RegExp(q.get('hide')); car.traverse(o => { if (re.test(o.name)) o.visible = false; }); }
window.car = car; window.THREE = THREE;
{ const b = new THREE.Box3().setFromObject(car); window.bbox = [b.min.toArray(), b.max.toArray()]; }
if (q.has('doors')) [['BodyDoorLColor1', 1], ['BodyDoorRColor1', -1]].forEach(([n, s]) => { const d = car.getObjectByName(n); if (d) d.rotation.set(72 * Math.PI / 180, s * 9 * Math.PI / 180, 0, 'YXZ'); });
if (q.has('wing')) { const w = car.getObjectByName('RearWing'); if (w) w.rotation.x = g('wing', 24) * Math.PI / 180; }
r.render(sc, cam); document.title = 'done';
</script></body></html>
